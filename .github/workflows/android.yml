name: android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK r27
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust (android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.PAXCORE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/paxcore.jks"
          echo "PAXCORE_KEYSTORE_PATH=$RUNNER_TEMP/paxcore.jks" >> "$GITHUB_ENV"
          echo "PAXCORE_KEYSTORE_PASSWORD=${{ secrets.PAXCORE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "PAXCORE_KEY_ALIAS=${{ secrets.PAXCORE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "PAXCORE_KEY_PASSWORD=${{ secrets.PAXCORE_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build engine (aarch64-linux-android)
        run: |
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android26-clang"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android26-clang"
          export CXX_aarch64_linux_android="$TC/aarch64-linux-android26-clang++"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export RANLIB_aarch64_linux_android="$TC/llvm-ranlib"
          cargo build --target aarch64-linux-android --release
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/paxcore \
             android/app/src/main/jniLibs/arm64-v8a/libpaxcore.so

      - name: Build APK (debug, pinned key)
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi
            echo "gradle attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Assert APK contents
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk > apk-list.txt
          grep -q "lib/arm64-v8a/libpaxcore.so" apk-list.txt
          grep -q "assets/gbrootfs.zip" apk-list.txt
          # useLegacyPackaging must survive into the merged
          # manifest: without extractNativeLibs=true the .so
          # never lands as an executable file in
          # nativeLibraryDir.
          AAPT="$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)"
          "$AAPT" dump xmltree android/app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml \
            | grep -q "extractNativeLibs.*0xffffffff"
          # The engine must be an AArch64 Android PIE.
          mkdir -p /tmp/apkx && cd /tmp/apkx
          unzip -q -o "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk" "lib/arm64-v8a/libpaxcore.so"
          file lib/arm64-v8a/libpaxcore.so | grep -q "ARM aarch64"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paxcore-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
